server:
  port: 8000

spring:
  application:
    name: flight-aggregation

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/flights}
    username: ${DB_USER:flight}
    password: ${DB_PASSWORD:flight}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.ota.flights: INFO
    org.hibernate.SQL: WARN
